name: Deploy preview

# Runs only after CI has actually passed on main — this workflow never
# builds or tests anything itself, it only builds *for deployment* and
# deploys trusted, already-validated code. A commit that failed CI can
# never reach this workflow.
#
# Phase 20 (2026-09-08): the trigger-level `branches: [main]` filter this
# used to carry never matched a CI run dispatched by merge-when-green.yml's
# own `workflow_dispatch` re-run step (actor `github-actions[bot]`) — found
# live: `gh api .../runs/<id>` on that exact completed run confirmed
# `head_branch: "main"` (an exact string match against the filter), yet no
# "Deploy preview" run was ever created, while `merge-when-green.yml`'s own
# `workflow_run` listener on the same "CI" workflow fired correctly for a
# *different* upstream run (the PR branch's own pull_request-triggered CI,
# not the main-branch dispatch). The real cause, found after that first fix
# still didn't produce a run: GitHub's anti-recursion protection for the
# default GITHUB_TOKEN applies transitively — a `workflow_dispatch` run
# started BY a GITHUB_TOKEN action (merge-when-green.yml's own re-dispatch
# of ci.yml) can itself complete normally (workflow_dispatch is the one
# documented exception that lets it start at all — see ci.yml's own
# comment), but *its* completion cannot trigger a further `workflow_run`
# listener; that second hop is exactly what the recursion guard blocks. No
# branch-filter fix can work around this. `workflow_dispatch` is added
# here as a second, direct trigger for the same reason ci.yml already uses
# it — merge-when-green.yml now dispatches this workflow the same way it
# dispatches ci.yml, and it can also be run manually.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA on main to deploy to preview (defaults to main's current tip)"
        required: false

concurrency:
  # A newer preview deploy always wins — an in-flight deploy of an older
  # commit is cancelled rather than being allowed to overwrite a newer one.
  group: deploy-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, deploy and verify preview
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Resolves to the right commit regardless of which trigger fired this run:
      # an explicit workflow_dispatch input, the workflow_run event's own head
      # commit, or (workflow_dispatch with no input given) main's current tip.
      DEPLOY_SHA: ${{ github.event.inputs.commit_sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the preview environment contract
        run: pnpm run env:validate:preview

      - name: Build for preview
        run: pnpm run build:preview

      - name: Apply pending migrations to preview D1 only
        run: >
          pnpm exec wrangler d1 migrations apply crawlpact-db-preview --remote
          --config apps/web/wrangler.jsonc --env preview

      # Idempotent (INSERT OR IGNORE) — safe to run on every deploy. Without this, a migration
      # that adds a new reference-data table (e.g. Phase 6's plan_prices) ships as an empty table
      # until this runs, breaking any route that reads it (e.g. /pricing throwing on a missing
      # active price row) even though the migration itself succeeded. See
      # docs/billing/BILLING_DEPLOYMENT_AND_ROLLBACK_RUNBOOK.md.
      - name: Seed reference data into preview D1
        run: pnpm run db:seed:reference-data:remote:preview

      - name: Deploy preview Worker
        run: pnpm run deploy:preview

      - name: Verify deployed bindings match wrangler.jsonc
        run: pnpm run deploy:verify-bindings preview

      - name: Smoke test the deployed preview
        run: pnpm run smoke:preview

      - name: Install Chrome for Lighthouse
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: setup-chrome

      - name: Lighthouse budget check against the deployed preview
        run: pnpm run lighthouse:check https://preview.crawlpact.com
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          LIGHTHOUSE_ARTIFACT_DIR: ${{ runner.temp }}/lighthouse

      # Phase 11 (Stage 11G): always uploaded, not just on failure — a
      # passing run's full per-run data (not just the gating median) is
      # what makes a suspicious pass (e.g. a median that only barely
      # cleared threshold) inspectable after the fact, matching the
      # median-of-3 gating this script now uses.
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-results-${{ env.DEPLOY_SHA }}
          path: ${{ runner.temp }}/lighthouse/lighthouse-results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Record deployment summary
        if: always()
        run: |
          {
            echo "### Preview deployment"
            echo "- Commit: \`${{ env.DEPLOY_SHA }}\`"
            echo "- URL: https://preview.crawlpact.com"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-deploy-failure-${{ env.DEPLOY_SHA }}
          path: apps/web/dist/server/wrangler.json
          retention-days: 14
          if-no-files-found: ignore
