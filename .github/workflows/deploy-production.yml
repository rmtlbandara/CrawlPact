name: Deploy production

# Deliberately NOT triggered by push — production is never deployed
# automatically. This only ever runs when a human explicitly dispatches it
# with a commit SHA and a typed confirmation, per CLAUDE.md's non-negotiable
# rule that production deployment requires explicit, in-the-moment
# authorization every time.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA on main to deploy"
        required: true
      confirm:
        description: 'Type exactly "DEPLOY PRODUCTION" to proceed'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, build, deploy and smoke-test production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Require the exact typed confirmation
        if: github.event.inputs.confirm != 'DEPLOY PRODUCTION'
        run: |
          echo "::error::confirm input must be exactly \"DEPLOY PRODUCTION\" — refusing to deploy."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit_sha }}
          fetch-depth: 0

      - name: Require the commit to be contained in main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${{ github.event.inputs.commit_sha }}" origin/main; then
            echo "::error::${{ github.event.inputs.commit_sha }} is not contained in origin/main — refusing to deploy."
            exit 1
          fi

      - name: Require CI (including e2e-and-a11y) to have actually succeeded for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `pnpm run release:check` below re-verifies format/lint/typecheck/
        # unit/integration/build fresh, but that script has never included
        # e2e/a11y (they need a running dev server and Playwright browsers,
        # not a fit for a quick pre-deploy re-check) — so re-running it
        # tells you nothing about whether e2e-and-a11y passed. This checks
        # the *actual* CI workflow run recorded against this exact commit
        # SHA, which does include it. Found missing while reasoning through
        # why `main`'s e2e-and-a11y being red wouldn't otherwise block this
        # workflow at all.
        run: |
          sha="${{ github.event.inputs.commit_sha }}"
          conclusion=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --branch main \
            --json headSha,conclusion,createdAt --limit 50 \
            --jq "[.[] | select(.headSha == \"$sha\")] | sort_by(.createdAt) | last | .conclusion // \"none\"")
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI has not succeeded for commit $sha (found: '$conclusion'). This includes e2e-and-a11y, not just the quality job — refusing to deploy past a known-failing or unverified CI result."
            exit 1
          fi
          echo "CI succeeded for $sha (including e2e-and-a11y) — proceeding."

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-run the full quality gate against this exact commit
        run: pnpm run release:check

      - name: Validate the production environment contract
        run: pnpm run env:validate:production

      - name: Build for production
        run: pnpm run build:production

      - name: Record build artifact checksum
        run: |
          checksum=$(sha256sum apps/web/dist/server/wrangler.json | cut -d' ' -f1)
          echo "Build artifact checksum: $checksum"
          echo "artifact_checksum=$checksum" >> "$GITHUB_ENV"

      - name: Apply pending migrations to production D1
        run: >
          pnpm exec wrangler d1 migrations apply crawlpact-db --remote
          --config apps/web/wrangler.jsonc

      - name: Deploy production Worker
        # set -o pipefail is required here: without it, `| tee` always exits 0
        # (tee's own exit code), so a real `wrangler deploy` failure would be
        # silently swallowed and this step would report success regardless.
        # Confirmed live 2026-07-29: exactly this masked a real failure
        # (scripts/deploy.sh's clean-tree check tripping on deploy-output.txt
        # itself — see below) across every gated deploy attempt that day,
        # none of which had actually deployed anything despite showing green.
        # deploy-output.txt is written to /tmp, not the repo root: writing it
        # inside the checkout made deploy.sh's own `git status --porcelain`
        # clean-tree check see an untracked file and refuse to deploy —
        # tripped by its own sibling step's output file.
        run: |
          set -o pipefail
          pnpm run deploy:production | tee /tmp/deploy-output.txt

      - name: Record deployed Worker version
        run: |
          version_id=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/deploy-output.txt | tail -1 || true)
          echo "worker_version_id=$version_id" >> "$GITHUB_ENV"
          {
            echo "### Production deployment"
            echo "- Commit: \`${{ github.event.inputs.commit_sha }}\`"
            echo "- Worker version ID: \`${version_id:-unknown — see deploy-output.txt artifact}\`"
            echo "- Wrangler version: $(pnpm exec wrangler --version)"
            echo "- Build artifact checksum: \`${artifact_checksum}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed bindings match wrangler.jsonc
        run: pnpm run deploy:verify-bindings production

      - name: Smoke test production
        run: pnpm run smoke:production

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-deploy-${{ github.event.inputs.commit_sha }}
          path: |
            /tmp/deploy-output.txt
            apps/web/dist/server/wrangler.json
          retention-days: 90
          if-no-files-found: ignore
