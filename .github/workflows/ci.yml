name: CI

# `quality` and `browser-smoke` run concurrently (no needs: dependency between
# them) — `ci-gate` is the one stable, required aggregate check. See
# docs/architecture/adr/ADR-0008-remove-pixel-visual-regression.md and
# docs/testing/TEST_STRATEGY.md for the full redesign rationale.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Safe, non-secret placeholder values so CI can boot the app's env
  # validation without any real credential (see docs/deployment/ENVIRONMENTS.md).
  # No real Paddle or Cloudflare credential is ever required for this workflow.
  PUBLIC_APP_ENV: local
  PUBLIC_SITE_URL: http://localhost:4321
  SESSION_SIGNING_SECRET: ci-placeholder-secret-value-not-real-00000000
  WEBAUTHN_RP_ID: localhost
  WEBAUTHN_RP_ORIGIN: http://localhost:4321
  PADDLE_API_KEY: ci-placeholder
  PADDLE_ENVIRONMENT: sandbox
  PADDLE_WEBHOOK_SECRET: ci-placeholder
  PADDLE_PRICE_ID_SOLO: pri_ci_placeholder
  PADDLE_PRICE_ID_PRO: pri_ci_placeholder
  PADDLE_PRICE_ID_AGENCY: pri_ci_placeholder
  PUBLIC_PADDLE_CLIENT_TOKEN: ci-placeholder
  BILLING_ENABLED: "false"
  AUDIT_ENGINE_ENABLED: "false"

jobs:
  quality:
    name: Format, lint, typecheck, unit + integration tests, build
    runs-on: ubuntu-latest
    permissions:
      # gitleaks-action needs to list the PR's commits to scan them on
      # `pull_request` events (GET /pulls/{n}/commits) — without this, the
      # default token's read-only `contents` scope makes that call 403.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Validate D1 migrations against Drizzle schema
        run: pnpm db:validate

      - name: Dependency vulnerability check
        run: pnpm audit --audit-level=critical
        # Reviewed 2026-07-29 (re-reviewed during the release-flow
        # remediation): still 3 high advisories, all in dev-only tooling
        # (sharp/libvips via wrangler's miniflare, brace-expansion via
        # @typescript-eslint's minimatch) — never in a production runtime
        # dependency, never reachable by attacker-controlled input. Kept
        # informational deliberately, not by default; see
        # docs/status/KNOWN_RISKS.md for the specific advisories accepted
        # and re-review whenever this step's output changes.
        continue-on-error: true

      - name: Build
        run: pnpm build

  browser-smoke:
    name: Chromium E2E + accessibility smoke (production-like build)
    runs-on: ubuntu-latest
    # Pinned to the exact @playwright/test version in package.json — no
    # separate `playwright install --with-deps` step needed, the container
    # already ships matching browser binaries.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Apply D1 migrations and seed data
        run: pnpm db:migrate && pnpm db:seed

      - name: Write CI-local .dev.vars for the built Worker
        # wrangler resolves .dev.vars relative to the *config file's own
        # directory*, not cwd (confirmed in wrangler's own
        # getVarsForDev/getLocalPersistencePath source) — since this job runs
        # `wrangler dev` against the generated apps/web/dist/server/wrangler.json,
        # the override file must live at apps/web/dist/server/.dev.vars, not
        # apps/web/.dev.vars (which is where astro dev's platform proxy reads
        # it from instead). Without this, the built Worker would boot with
        # the production vars baked into the build (WEBAUTHN_RP_ID=
        # crawlpact.com, etc. — plain `pnpm build` bakes the top-level
        # wrangler.jsonc vars, not env.preview/production-specific ones),
        # which would fail every passkey ceremony against localhost:4321.
        run: |
          mkdir -p apps/web/dist/server
          cat > apps/web/dist/server/.dev.vars << 'DEVVARS'
          PUBLIC_APP_ENV=local
          PUBLIC_SITE_URL=http://localhost:4321
          SESSION_SIGNING_SECRET=ci-placeholder-secret-value-not-real-00000000
          WEBAUTHN_RP_ID=localhost
          WEBAUTHN_RP_ORIGIN=http://localhost:4321
          PADDLE_API_KEY=ci-placeholder
          PADDLE_ENVIRONMENT=sandbox
          PADDLE_WEBHOOK_SECRET=ci-placeholder
          PADDLE_PRICE_ID_SOLO=pri_ci_placeholder
          PADDLE_PRICE_ID_PRO=pri_ci_placeholder
          PADDLE_PRICE_ID_AGENCY=pri_ci_placeholder
          PUBLIC_PADDLE_CLIENT_TOKEN=ci-placeholder
          BILLING_ENABLED=false
          AUDIT_ENGINE_ENABLED=true
          DEVVARS

      - name: Start production-like Worker (wrangler dev --local)
        # --persist-to explicitly points at the same directory
        # `pnpm db:migrate`/`db:seed` already persisted to by default (their
        # default, unset --persist-to resolves relative to apps/web/wrangler.jsonc's
        # own directory, i.e. apps/web/.wrangler/state) — the generated
        # apps/web/dist/server/wrangler.json lives one directory deeper, so
        # without this override wrangler dev would default to a different,
        # empty local D1/KV state.
        env:
          # Disables an AI-agent-oriented wrangler feature (on by default in
          # 4.114.0), not needed for an automated test run — an early
          # suspect (since ruled out) in a dev-server crash found while
          # designing this job; disabled defensively regardless. See
          # docs/status/KNOWN_RISKS.md for the crash's actual confirmed
          # root cause (global-setup.ts's warmup, now fixed).
          X_LOCAL_EXPLORER: "false"
        run: |
          pnpm exec wrangler dev \
            --config apps/web/dist/server/wrangler.json \
            --local \
            --persist-to apps/web/.wrangler/state \
            --port 4321 \
            > /tmp/wrangler-dev.log 2>&1 &

      - name: Wait for server
        run: npx wait-on http://localhost:4321 --timeout 60000

      - name: E2E tests (required Chromium smoke)
        run: pnpm test:e2e:chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4321

      - name: Accessibility tests (required Chromium smoke)
        run: pnpm test:a11y:chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4321

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-failure-diagnostics
          path: |
            playwright-report/
            test-results/
            /tmp/wrangler-dev.log
            apps/web/dist/server/wrangler.json
          retention-days: 14
          if-no-files-found: ignore

  ci-gate:
    name: CI
    if: always()
    needs: [quality, browser-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require both required jobs to have actually succeeded
        run: |
          echo "quality: ${{ needs.quality.result }}"
          echo "browser-smoke: ${{ needs.browser-smoke.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.browser-smoke.result }}" != "success" ]; then
            echo "::error::A required job did not succeed (failure, cancellation, or unexpected skip) — failing the aggregate CI gate."
            exit 1
          fi
