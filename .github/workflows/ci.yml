name: CI

# `quality` and `browser-smoke` run concurrently (no needs: dependency between
# them) — `ci-gate` is the one stable, required aggregate check. See
# docs/architecture/adr/ADR-0008-remove-pixel-visual-regression.md and
# docs/testing/TEST_STRATEGY.md for the full redesign rationale.

on:
  pull_request:
  push:
    branches: [main]
  # Explicitly dispatched by merge-when-green.yml right after it squash-merges
  # a PR: GitHub does not trigger `push`-based workflows from an action taken
  # with the default GITHUB_TOKEN (documented, deliberate anti-recursion
  # behaviour — `workflow_dispatch`/`repository_dispatch` are the two
  # explicit exceptions). Without this, main's own post-merge CI run would
  # never exist, and deploy-production.yml's "CI succeeded for this exact
  # commit" check would permanently refuse every automerged commit. See
  # docs/status/KNOWN_RISKS.md.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Repo-wide default: every job gets read-only contents unless it explicitly
# needs more (quality further narrows nothing, since pull-requests: read is
# additive for gitleaks). Without this, jobs with no job-level permissions:
# block (browser-smoke, ci-gate) inherit whatever the org/repo default
# GITHUB_TOKEN policy is, which can be broader than needed.
permissions:
  contents: read

env:
  # Safe, non-secret placeholder values so CI can boot the app's env
  # validation without any real credential (see docs/deployment/ENVIRONMENTS.md).
  # No real Paddle or Cloudflare credential is ever required for this workflow.
  PUBLIC_APP_ENV: local
  PUBLIC_SITE_URL: http://localhost:4321
  SESSION_SIGNING_SECRET: ci-placeholder-secret-value-not-real-00000000
  ABUSE_MONITORING_SECRET: ci-placeholder-abuse-secret-value-not-real-0000
  WEBAUTHN_RP_ID: localhost
  WEBAUTHN_RP_ORIGIN: http://localhost:4321
  PADDLE_API_KEY: ci-placeholder
  PADDLE_ENVIRONMENT: sandbox
  PADDLE_WEBHOOK_SECRET: ci-placeholder
  PADDLE_PRICE_ID_SOLO: pri_ci_placeholder
  PADDLE_PRICE_ID_PRO: pri_ci_placeholder
  PADDLE_PRICE_ID_AGENCY: pri_ci_placeholder
  PUBLIC_PADDLE_CLIENT_TOKEN: ci-placeholder
  BILLING_ENABLED: "false"
  AUDIT_ENGINE_ENABLED: "false"

jobs:
  quality:
    name: Format, lint, typecheck, unit + integration tests, build
    runs-on: ubuntu-latest
    permissions:
      # gitleaks-action needs to list the PR's commits to scan them on
      # `pull_request` events (GET /pulls/{n}/commits) — without this, the
      # default token's read-only `contents` scope makes that call 403.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Security regression suite
        run: pnpm test:security

      - name: Validate D1 migrations against Drizzle schema
        run: pnpm db:validate

      - name: Validate documentation governance
        run: pnpm docs:validate

      - name: Validate brand and messaging governance
        run: pnpm brand:validate

      - name: Validate legal, trust, and contact governance
        run: pnpm trust:validate

      - name: Validate status and changelog trust presentation
        run: pnpm status:validate

      - name: Validate content-collection quality
        # Phase 12: this script already existed (Phase 7) and was already
        # wired into `pnpm quality`/`pnpm run quality:gate`, but had never
        # actually been run in CI itself — a real, confirmed gap found while
        # reconciling `quality:gate`'s step list against what CI actually
        # gates on. Read-only, no network access, so safe to run on every PR.
        run: pnpm content:validate

      - name: Validate repository privacy posture
        run: pnpm repo-privacy:validate

      - name: Validate analytics/consent architecture
        run: pnpm analytics:validate

      - name: Dependency vulnerability check (blocking on critical)
        # Phase 12 (2026-08-09): continue-on-error removed — this is now a
        # real gate. `--audit-level=critical` (plain text, not --json — pnpm's
        # --json output exits 1 whenever *any* advisory exists regardless of
        # severity, a known quirk that would make a --json-based gate fail on
        # every non-critical advisory too) only fails the step when a
        # critical-severity advisory exists; 0 exist as of this review.
        # High/moderate advisories still print in the log for visibility but
        # no longer block CI — current count (re-verified this phase): 8
        # high + 4 moderate, all in dev-only tooling (sharp/libvips and
        # undici/fast-uri via wrangler's miniflare, brace-expansion via
        # @typescript-eslint's minimatch, js-yaml/nanoid via dev tooling
        # chains) — never a production runtime dependency, never reachable by
        # attacker-controlled input. See docs/security/DEPENDENCY_VULNERABILITY_POLICY.md.
        run: pnpm audit --audit-level=critical

      - name: Build
        run: pnpm build

      - name: Validate repository privacy posture (post-build source-map check)
        run: pnpm repo-privacy:validate

  browser-smoke:
    name: Chromium E2E + accessibility smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply D1 migrations and seed data
        run: pnpm db:migrate && pnpm db:seed

      - name: Write CI-local .dev.vars for Cloudflare secret bindings
        # SESSION_SIGNING_SECRET/PADDLE_API_KEY/PADDLE_WEBHOOK_SECRET are
        # secret_text bindings, not wrangler.jsonc vars — Astro's Cloudflare
        # dev-mode platform proxy only receives secret values from a local
        # .dev.vars file.
        run: |
          cat > apps/web/.dev.vars << 'DEVVARS'
          PUBLIC_APP_ENV=local
          PUBLIC_SITE_URL=http://localhost:4321
          SESSION_SIGNING_SECRET=ci-placeholder-secret-value-not-real-00000000
          ABUSE_MONITORING_SECRET=ci-placeholder-abuse-secret-value-not-real-0000
          WEBAUTHN_RP_ID=localhost
          WEBAUTHN_RP_ORIGIN=http://localhost:4321
          PADDLE_API_KEY=ci-placeholder
          PADDLE_ENVIRONMENT=sandbox
          PADDLE_WEBHOOK_SECRET=ci-placeholder
          PADDLE_PRICE_ID_SOLO=pri_ci_placeholder
          PADDLE_PRICE_ID_PRO=pri_ci_placeholder
          PADDLE_PRICE_ID_AGENCY=pri_ci_placeholder
          PUBLIC_PADDLE_CLIENT_TOKEN=ci-placeholder
          BILLING_ENABLED=false
          AUDIT_ENGINE_ENABLED=true
          DEVVARS

      - name: Start preview server
        # Deliberately Astro dev mode, not `wrangler dev --local` against the
        # built Worker. This PR fixed the originally-diagnosed crash cause
        # (a *second* `wrangler d1 execute --local` process racing this
        # server's own D1 connection) by routing admin-db.ts's writes through
        # this same running server instead — but real CI then reproduced a
        # SECOND, distinct wrangler dev --local crash (empty `[ERROR]`, no
        # message body) immediately after a real usernameless
        # `POST /api/auth/login/begin` → `login/finish` sign-in, 2 of 3 real
        # CI runs, never once locally. That request path doesn't touch D1 at
        # all (`login/begin` is pure WebCrypto), so this is not the same bug
        # this PR fixed — see docs/status/KNOWN_RISKS.md's "Built-server E2E:
        # a second, distinct wrangler dev --local crash" entry for the full
        # evidence (including the downloaded wrangler-dev.log) and a
        # concrete next lead (wrangler flagged a newer 4.115.0 release in its
        # own crash output). Reverting to Astro dev mode again until that's
        # actually root-caused — real CI reliability, not local passes, is
        # what decides this gate.
        run: pnpm --filter @crawlpact/web dev &
        env:
          AUDIT_ENGINE_ENABLED: "true"

      - name: Wait for server
        run: npx wait-on http://localhost:4321 --timeout 60000

      - name: E2E tests (required Chromium smoke)
        run: pnpm test:e2e:chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4321

      - name: Accessibility tests (required Chromium smoke)
        run: pnpm test:a11y:chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4321

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-failure-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  ci-gate:
    name: CI
    if: always()
    needs: [quality, browser-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require both required jobs to have actually succeeded
        run: |
          echo "quality: ${{ needs.quality.result }}"
          echo "browser-smoke: ${{ needs.browser-smoke.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.browser-smoke.result }}" != "success" ]; then
            echo "::error::A required job did not succeed (failure, cancellation, or unexpected skip) — failing the aggregate CI gate."
            exit 1
          fi
